<script src="config.js" onerror="void 0"></script>
<script>
/* ===== Informations de l'entreprise : à remplacer avant la mise en ligne ===== */
const SITE={
  name:"Autovia",
  phone:"01 84 00 00 00",phoneHref:"+33184000000",
  email:"bonjour@autovia-demo.fr",
  address:"12 avenue de l'Automobile, 75000 Paris",
  hours:["Lun–Ven : 9h00–18h30","Sam : 9h00–17h00"],
  legal:{company:"",form:"",capital:"",siret:"",rcs:"",tva:"",director:"",host:"",retention:"",mediator:""},   // pour la page Mentions légales
  googleReviewsUrl:"",                                       // lien vers votre fiche Google
  reviews:[],                                                // vrais avis clients : [{author:"", text:"", rating:5}]
  sampleReviews:[{author:"Client exemple A",text:"Accueil sérieux, véhicule conforme à l'annonce et démarches expliquées clairement.",rating:5},{author:"Client exemple B",text:"Réponse rapide et rendez-vous simple à organiser.",rating:5},{author:"Client exemple C",text:"Estimation claire de ma reprise, sans pression.",rating:5}]
};
/* ================================================================== */

const hasConfig=window.SUPABASE_URL&&window.SUPABASE_URL.includes("supabase.co")&&window.SUPABASE_ANON_KEY&&window.SUPABASE_ANON_KEY!=="VOTRE_CLE_ANON_OU_PUBLISHABLE";
const sb=hasConfig?supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY):null;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const km=n=>(n||0).toLocaleString("fr-FR")+" km";
const FALLBACK="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1200&q=80";
const U=id=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=1200&q=80`;
const demo=[
{id:"demo1",slug:"bmw-serie-3-320i-m-sport-2024",brand:"BMW",model:"Série 3",version:"320i M Sport",year:2024,mileage:18900,fuel:"Essence",gearbox:"Automatique",price:39490,monthly_payment:549,power_hp:184,co2_g_km:145,status:"available",badge:"Coup de cœur",equipment:["Caméra de recul","GPS","Sièges chauffants","Régulateur adaptatif","Apple CarPlay"],img:U("photo-1555215695-3004980ad54e")},
{id:"demo2",slug:"peugeot-308-gt-hybrid-180-2025",brand:"Peugeot",model:"308",version:"GT Hybrid 180",year:2025,mileage:9800,fuel:"Hybride",gearbox:"Automatique",price:31990,monthly_payment:449,power_hp:180,co2_g_km:30,status:"available",badge:"Nouveau",equipment:["Toit panoramique","Caméra 360","GPS","Sièges chauffants"],img:U("photo-1542362567-b07e54358753")},
{id:"demo3",slug:"volkswagen-golf-etsi-r-line-2024",brand:"Volkswagen",model:"Golf",version:"1.5 eTSI R-Line",year:2024,mileage:14500,fuel:"Essence",gearbox:"Automatique",price:29490,monthly_payment:419,power_hp:150,co2_g_km:125,status:"available",badge:"",equipment:["LED Matrix","Digital Cockpit","CarPlay"],img:U("photo-1504215680853-026ed2a45def")}];

let cache=null;
async function vehicles(){
  if(cache)return cache;
  if(!sb)return cache=demo;
  const {data,error}=await sb.from("vehicles").select("*,vehicle_images(*)").eq("published",true).neq("status","draft").order("featured",{ascending:false}).order("created_at",{ascending:false});
  if(error){console.error(error);return null}
  return cache=data||[];
}
const title=v=>`${v.brand} ${v.model}${v.version?" "+v.version:""}`;
const pubUrl=p=>!p?FALLBACK:/^https?:/.test(p)?p:sb.storage.from("vehicle-images").getPublicUrl(p).data.publicUrl;
const photos=v=>{const a=[...(v.vehicle_images||[])].sort((x,y)=>x.sort_order-y.sort_order).map(i=>pubUrl(i.storage_path));return a.length?a:[v.img||FALLBACK]};
const tagOf=v=>v.status==="sold"?["Vendu","sold"]:v.status==="reserved"?["Réservé","sold"]:v.badge?[v.badge,""]:null;
const href=v=>`#/vehicule/${encodeURIComponent(v.slug)}`;

function card(v){
  const t=tagOf(v);
  return `<article class="car"><a class="cover" href="${href(v)}" aria-label="${esc(title(v))}, ${money(v.price)}"></a>
<div class="ph${v.status==="sold"?" is-sold":""}"><img src="${esc(photos(v)[0])}" alt="${esc(title(v))}" loading="lazy" width="600" height="450">${t?`<span class="tag ${t[1]}">${esc(t[0])}</span>`:""}${mark(v)}${favBtn(v)}</div>
<div class="body"><p class="brand">${esc(v.brand)}</p><h3>${esc(v.model)}${v.version?" "+esc(v.version):""}</h3>
<p class="meta">${v.year||""} · ${km(v.mileage)} · ${esc(v.fuel||"")} · ${esc(v.gearbox||"")}</p>
<p class="price">${money(v.price)}</p>${v.monthly_payment?`<p class="monthly">ou environ ${money(v.monthly_payment)}/mois, sur étude</p>`:""}</div></article>`;
}
const opts=(list,sel,label)=>`<option value="">${label}</option>`+[...new Set(list.filter(Boolean))].sort().map(x=>`<option${String(x)===String(sel)?" selected":""}>${esc(x)}</option>`).join("");
const priceOpts=sel=>`<option value="">Prix max.</option>`+[15000,20000,25000,30000,40000,50000].map(p=>`<option value="${p}"${String(p)===String(sel)?" selected":""}>${money(p)}</option>`).join("");

function field(name,label,o={}){
  const t=o.type||"text";
  const inner=t==="select"?`<select id="f-${name}" name="${name}"${o.req?" required":""}>${o.opts}</select>`
    :t==="textarea"?`<textarea id="f-${name}" name="${name}"${o.req?" required":""}></textarea>`
    :`<input id="f-${name}" name="${name}" type="${t}"${o.req?" required":""}${o.ac?` autocomplete="${o.ac}"`:""}${o.inputmode?` inputmode="${o.inputmode}"`:""}>`;
  return `<div${o.full?' class="full"':""}><label for="f-${name}">${label}${o.req?" *":""}</label>${inner}</div>`;
}
const consent=`<label class="chk full"><input type="checkbox" name="consent" required><span>J'accepte que ces informations soient utilisées pour traiter ma demande. <a href="#/mentions">En savoir plus</a></span></label><input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><p class="status full" role="status" aria-live="polite"></p>`;
const fuels=["Essence","Diesel","Hybride","Électrique"],boxes=["Automatique","Manuelle"];
const so=list=>list.map(x=>`<option>${x}</option>`).join("");

/* ---------- Pages ---------- */
const pageHead=(h,p)=>`<section class="page"><div class="wrap"><h1>${h}</h1><p>${p}</p></div></section>`;
const loading=`<div class="wrap section"><div class="skel"></div></div>`;
const failed=`<div class="wrap section"><div class="empty"><h2>Les véhicules sont momentanément indisponibles</h2><p>Merci de réessayer dans quelques instants ou de nous appeler au ${esc(SITE.phone)}.</p></div></div>`;

async function home(){
  const vs=await vehicles();if(!vs)return{html:failed,title:SITE.name};
  let live=[];if(sb){try{const {data}=await sb.from("reviews").select("author_name,comment,rating").eq("status","approved").order("created_at",{ascending:false}).limit(6);live=(data||[]).map(r=>({author:r.author_name,text:r.comment,rating:r.rating}))}catch(_){}}
  const all=[...live,...SITE.reviews],real=all.length>0,list=real?all:(sb?[]:SITE.sampleReviews);
  const reviews=list.length?`<section class="section soft"><div class="wrap"><div class="head"><div><span class="eyebrow">Avis clients</span><h2>Ils nous ont fait confiance</h2>${real?'<p class="m">Avis de clients ayant acheté chez nous, vérifiés avant publication.</p>':'<p><span class="sample">Exemples de maquette — à remplacer par de vrais avis avant la mise en ligne</span></p>'}</div>${real&&SITE.googleReviewsUrl?`<a href="${esc(SITE.googleReviewsUrl)}" rel="noopener" target="_blank">Tous les avis Google</a>`:""}</div><div class="cards3">${list.map(r=>`<div class="rv"><div class="st" aria-label="${r.rating||5} sur 5">★★★★★</div><p>« ${esc(r.text)} »</p><b>${esc(r.author)}</b></div>`).join("")}</div></div></section>`:"";

/* ---------- Estimation (fictive pour l'instant) ----------
   Appelle l'Edge Function « estimate-vehicle » (API Claude) si elle est déployée, sinon utilise la formule de démonstration.
   Ne jamais mettre de clé API dans ce fichier. Garder la même signature et le même retour {low,high}. */
async function estimate(d,kind){
  if(sb){try{
    const {data,error}=await sb.functions.invoke("estimate-vehicle",{body:{brand:d.brand,model:d.model,year:+d.vehicle_year,mileage:+d.mileage,fuel:d.fuel,gearbox:d.gearbox,condition:d.condition,service_history:!!d.service_history,no_accident:!!d.no_accident}});
    if(!error&&data&&data.low>0&&data.high>=data.low)return{low:Math.round(data.low/100)*100,high:Math.round(data.high/100)*100,comment:data.comment||"",source:"ai"};
  }catch(e){console.warn("Estimation IA indisponible",e)}}
  return estimateDemo(d,kind);
}
async function estimateDemo(d,kind){
  await new Promise(r=>setTimeout(r,1100));
  const tier={BMW:1.25,Mercedes:1.25,Audi:1.2,Volkswagen:1,Peugeot:.9,Renault:.85,"Citroën":.85,Tesla:1.4,"Mercedes-Benz":1.25,Porsche:1.9,"Land Rover":1.3,Volvo:1.1,Lexus:1.2,Mini:1.05,Toyota:1,Dacia:.7,Fiat:.8,Opel:.85}[(d.brand||"").trim()]||1;
  const age=Math.max(0,new Date().getFullYear()-(+d.vehicle_year||new Date().getFullYear()));
  let val=30000*tier*Math.pow(.86,age);
  val*=Math.min(1.15,Math.max(.6,1-.02*((+d.mileage||0)-15000*age)/10000));
  val*={"Très bon":1.03,"Bon":1,"Correct":.93,"À prévoir":.84}[d.condition]||1;
  if(d.service_history)val*=1.02;if(d.no_accident)val*=1.02;
  
  const r=n=>Math.max(500,Math.round(n/100)*100);
  return{low:r(val*.95),high:r(val*1.05),source:"demo"};
}

async function sendLead(form){
  const st=$(".status",form),btn=$("button[type=submit]",form),d=Object.fromEntries(new FormData(form));
  const say=(m,ok)=>{st.textContent=m;st.className="status full "+(ok?"ok":"ko")};
  if(d.website){say("Votre demande a bien été envoyée.",true);return}
  delete d.website;delete d.consent;
  for(const k of Object.keys(d)){if(typeof d[k]==="string")d[k]=d[k].trim();if(d[k]==="")delete d[k]}
  const COLS=["first_name","last_name","phone","email","subject","message","registration","brand","model","vehicle_year","mileage","fuel","gearbox","condition"],extra={};for(const k of Object.keys(d))if(!COLS.includes(k)){extra[k]=d[k];delete d[k]}
  ["vehicle_year","mileage"].forEach(k=>{if(k in d){const n=parseInt(d[k],10);Number.isFinite(n)?d[k]=n:delete d[k]}});
  Object.assign(d,{type:form.dataset.lead,metadata:{...extra,consent:true,consent_at:new Date().toISOString(),source:form.dataset.source,page:location.href}});
  if(form.dataset.vehicle)d.vehicle_id=form.dataset.vehicle;
  if(!sb){say("Mode démonstration : cette demande n'a pas été enregistrée.",false);return}
  btn.disabled=true;
  const {error}=await sb.from("leads").insert(d);
  btn.disabled=false;
  if(error){console.error(error);say(`Votre demande n'a pas pu être envoyée. Réessayez ou appelez-nous au ${SITE.phone}.`,false)}
  else{say("Merci, votre demande a bien été envoyée. Nous revenons vers vous rapidement.",true);form.reset()}
}

(()=>{const b=$("#appbar");try{if(!localStorage.getItem("appbar")&&b)b.hidden=false}catch(_){if(b)b.hidden=false}syncHH();addEventListener("resize",syncHH);$("#appbar-x")?.addEventListener("click",()=>{b.hidden=true;try{localStorage.setItem("appbar","1")}catch(_){}syncHH()})})();
const ogm=(p,v)=>{if(!v)return;let m=$(`meta[property="${p}"]`);if(!m){m=document.createElement("meta");m.setAttribute("property",p);document.head.append(m)}m.content=v};
function meta(name,val){let m=$(`meta[name=${name}]`);if(m&&val)m.content=val}
async function brandPage(b,q){const p=await catalogue({...q,brand:b});p.title=`${b} d'occasion — ${SITE.name}`;p.desc=`Découvrez nos ${b} d'occasion : prix, kilométrage, année et garantie. ${SITE.name}.`;return p}
async function comparer(){
  const ids=JSON.parse(localStorage.getItem("cmp")||"[]"),vs=await vehicles();if(!vs)return{html:failed,title:SITE.name};const l=ids.map(i=>vs.find(v=>v.id===i)).filter(Boolean);
  const R=[["Prix",v=>money(v.price)],["Année",v=>v.year],["Kilométrage",v=>v.mileage!=null?v.mileage.toLocaleString("fr-FR")+" km":"—"],["Carburant",v=>v.fuel],["Boîte",v=>v.gearbox],["Puissance",v=>v.power_hp?v.power_hp+" ch":"—"],["Places",v=>v.seats],["Crit\'Air",v=>v.crit_air],["CO₂",v=>v.co2_g_km?v.co2_g_km+" g/km":"—"],["Garantie",v=>v.warranty]];
  return{title:`Comparateur — ${SITE.name}`,html:pageHead("Comparateur","Comparez jusqu'à 3 véhicules côte à côte.")+`<section class="section"><div class="wrap">${l.length?`<div style="overflow-x:auto"><table class="cmp"><tr><th></th>${l.map(v=>`<th><a href="#/vehicule/${v.slug}">${esc(title(v))}</a><br><button class="btn btn-line" style="padding:6px 12px;font-size:13px;margin-top:6px" data-cmpdel="${v.id}">Retirer</button></th>`).join("")}</tr>${R.map(([n,f])=>`<tr><th>${n}</th>${l.map(v=>`<td>${esc(f(v)??"—")}</td>`).join("")}</tr>`).join("")}</table></div>`:`<div class="empty"><p>Aucun véhicule à comparer. Ouvrez une fiche et cliquez sur « Comparer ».</p><a class="btn btn-acc" href="#/acheter">Voir les véhicules</a></div>`}</div></section>`}
}
async function signPage(q){
  const bad=(h,m)=>({title:SITE.name,html:pageHead(h,m)+`<div class="wrap section"><a class="btn btn-acc" href="#/compte">Mon compte</a></div>`});
  if(!sb)return{title:SITE.name,html:failed};if(!me)return bad("Connexion requise","Connectez-vous pour lire et signer votre document.");
  const {data:o}=await sb.from("order_signatures").select("*").eq("id",q.id||"").maybeSingle();if(!o)return bad("Document introuvable","Ce document n'existe pas ou ne vous est pas destiné.");
  const mine=o.user_id===me.id&&o.status==="pending",frame=`<iframe class="docframe" sandbox="" srcdoc="${esc(o.document_html)}" title="${esc(o.title)}"></iframe>`;
  const ui=mine?`<div class="info" style="margin-top:20px"><label style="display:flex;gap:12px;align-items:flex-start;cursor:pointer"><input type="checkbox" id="sig-ok" style="width:22px;height:22px;margin-top:2px"><span>J'ai lu le document ci-dessus et je l'approuve. Je comprends que ma signature électronique vaut accord sur son contenu.</span></label>
<div style="margin-top:14px"><label for="sig-name">Votre nom complet</label><input id="sig-name" autocomplete="name"></div><p style="margin:14px 0 6px"><b>Signez dans le cadre</b></p><canvas id="sig" width="700" height="220"></canvas>
<div class="actions"><button class="btn btn-line" id="sig-clear" type="button">Effacer</button><button class="btn btn-acc" id="sig-go" type="button">Signer le document</button></div><p class="status" id="sig-st" role="status"></p></div>`
  :o.status==="signed"?`<div class="info" style="margin-top:20px"><b>Signé électroniquement le ${new Date(o.signed_at).toLocaleString("fr-FR")} par ${esc(o.signer_name)}</b><br><img src="${esc(o.signature_png)}" alt="Signature" style="max-width:320px;border:1px solid var(--line);border-radius:10px;margin-top:10px;background:#fff"><p class="m">Empreinte du document (SHA-256) : ${esc(o.doc_hash)}</p><button class="btn btn-line" onclick="print()">Imprimer / Enregistrer en PDF</button></div>`:`<p class="m">En attente de la signature du client.</p>`;
  return{title:`${o.title} — ${SITE.name}`,html:pageHead(esc(o.title),mine?"Lisez le document puis signez-le.":"")+`<section class="section"><div class="wrap" style="max-width:860px">${frame}${ui}</div></section>`,
  after(){const c=$("#sig");if(!c)return;const x=c.getContext("2d");x.lineWidth=2.6;x.lineCap="round";x.strokeStyle="#0b1b3f";let dr=false,dirty=false;c.style.touchAction="none";
    const P=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
    c.onpointerdown=e=>{dr=true;c.setPointerCapture(e.pointerId);const[a,b]=P(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke();dirty=true};c.onpointermove=e=>{if(!dr)return;const[a,b]=P(e);x.lineTo(a,b);x.stroke()};c.onpointerup=()=>{dr=false};
    $("#sig-clear").onclick=()=>{x.clearRect(0,0,c.width,c.height);dirty=false};
    $("#sig-go").onclick=async()=>{const st=$("#sig-st"),nm=$("#sig-name").value.trim();if(!$("#sig-ok").checked||nm.length<2||!dirty){st.textContent="Cochez la case, indiquez votre nom et signez dans le cadre.";st.className="status ko";return}
      const {error}=await sb.rpc("sign_order",{p_id:o.id,p_signature:c.toDataURL("image/png"),p_name:nm,p_ua:navigator.userAgent});if(error){st.textContent="Signature impossible : "+error.message;st.className="status ko";return}router()}}}
}
async function router(){
  document.body.style.overflow="";$("#nav").classList.remove("open");$("#menu").setAttribute("aria-expanded","false");
  const {parts,q}=parse(),app=$("#app"),r=parts[0]||"";
  if(r==="reprise"){nav("/vendre",1);return}
  if(!cache)app.innerHTML=loading;
  if(sb&&me===undefined){try{await loadMe()}catch(e){console.error(e);me=null}}
  let page;
  try{
    page=r===""?await home():r==="acheter"?await catalogue(q):r==="vendre"?formPage(r):r==="services"?services():r==="apropos"?about():r==="compte"?await compte():r==="agence"?await agence(q):r==="contact"?await contact(q):r==="marque"?await brandPage(decodeURIComponent(parts[1]||""),q):r==="signer"?await signPage(q):r==="comparer"?await comparer():r==="mentions"?legal():r==="vehicule"?await vehiclePage(decodeURIComponent(parts[1]||"")):{title:`Page introuvable — ${SITE.name}`,html:pageHead("Page introuvable","Cette page n'existe pas ou n'existe plus.")+`<div class="wrap section"><a class="btn btn-acc" href="#/">Retour à l'accueil</a></div>`};
  }catch(e){console.error(e);page={title:SITE.name,html:failed}}
  app.innerHTML=page.html;page.after&&page.after();document.title=page.title;meta("description",page.desc);ogm("og:title",page.title);ogm("og:description",page.desc);ogm("og:url",location.origin+location.pathname);ogm("og:image",page.img);
  app.querySelectorAll("img:not([loading])").forEach((im,i)=>{if(i>1)im.loading="lazy";im.decoding="async"});
  $("#ld")?.remove();
  if(page.ld){const s=document.createElement("script");s.id="ld";s.type="application/ld+json";s.textContent=JSON.stringify(page.ld);document.head.append(s)}
  const cur=r==="vehicule"?"acheter":r;
  document.querySelectorAll("#nav a").forEach(a=>a.getAttribute("data-r")===cur?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  $("#nav").classList.remove("open");
  if(CLEAN){document.querySelectorAll('a[href^="#/"]').forEach(a=>a.setAttribute("href",a.getAttribute("href").slice(1)));
    let c=$("#canon");if(!c){c=document.createElement("link");c.id="canon";c.rel="canonical";document.head.append(c)}c.href=location.origin+location.pathname}
  let rb=$("#rb");if(["agence","compte"].includes(r)){if(!rb){rb=document.createElement("meta");rb.id="rb";rb.name="robots";rb.content="noindex";document.head.append(rb)}}else rb?.remove();$("#menu").setAttribute("aria-expanded","false");
  document.querySelectorAll("form[data-auth]").forEach(f=>f.addEventListener("submit",e=>{e.preventDefault();doAuth(f)}));
  $("#veh-form")&&bindVeh($("#veh-form"));
  document.querySelectorAll("form[data-val]").forEach(initWizard);
  document.querySelectorAll("form[data-lead]").forEach(f=>f.addEventListener("submit",e=>{e.preventDefault();sendLead(f)}));
  $("#search")?.addEventListener("submit",e=>{e.preventDefault();go("/acheter",Object.fromEntries(new FormData(e.target)))});
  $("#filter")?.addEventListener("change",e=>go("/acheter",Object.fromEntries(new FormData(e.currentTarget))));
  const main=$("#main-ph");
  if(main){const L=[...document.querySelectorAll(".thumbs button")].map(b=>b.dataset.src);if(!L.length)L.push(main.src);main.dataset.i=0;main.addEventListener("click",()=>lightbox(L,+main.dataset.i))}
  document.querySelectorAll(".thumbs button").forEach(b=>b.addEventListener("click",()=>{main.src=b.dataset.src;main.dataset.i=[...b.parentNode.children].indexOf(b);document.querySelectorAll(".thumbs button").forEach(x=>x.removeAttribute("aria-current"));b.setAttribute("aria-current","true")}));
{const m=$("#mob");m.innerHTML=page.mob||MOB;m.classList.toggle("v",!!page.mob)}
document.querySelectorAll(".section,.band,.split,.cta,.page").forEach(e=>e.classList.add("rev"));
  {const els=[...document.querySelectorAll(".rev")],show=e=>e.classList.add("in");
  if("IntersectionObserver"in window){const io=new IntersectionObserver(a=>a.forEach(x=>{if(x.isIntersecting){show(x.target);io.unobserve(x.target)}}),{threshold:.04});els.forEach(e=>io.observe(e));setTimeout(()=>els.forEach(show),2500)}else els.forEach(show)}
    if(!router.first){window.scrollTo(0,0);app.focus({preventScroll:true})}router.first=false;
}
router.first=true;

$("#footer").innerHTML=`<div class="wrap"><div class="cols"><div><a class="logo" href="#/" style="color:#fff">Auto<span>via</span></a><p>Achat et vente de véhicules d'occasion.</p></div>
<div><h3>Navigation</h3><ul><li><a href="#/acheter">Acheter</a></li><li><a href="#/vendre">Vendre</a></li><li><a href="#/services">Services</a></li><li><a href="#/compte">Mon compte</a></li><li><a href="#/agence">Espace agence</a></li></ul></div>
<div><h3>Contact</h3><p>${esc(SITE.address)}</p><p><a href="tel:${SITE.phoneHref}">${esc(SITE.phone)}</a><br><a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a></p></div>
<div><h3>Horaires</h3><p>${SITE.hours.map(esc).join("<br>")}</p></div></div>
<div class="legal"><span>© ${new Date().getFullYear()} ${esc(SITE.name)}</span><a href="#/mentions">Mentions légales et données personnelles</a></div></div>`;
$("#menu").addEventListener("click",()=>{const o=$("#nav").classList.toggle("open");document.body.style.overflow=o?"hidden":"";$("#menu").setAttribute("aria-expanded",o)});
window.addEventListener(CLEAN?"popstate":"hashchange",router);
document.addEventListener("click",e=>{const a=e.target.closest("a[href]");if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey||a.target)return;const u=a.getAttribute("href");
  if(u==="#app"){e.preventDefault();$("#app").focus();return}
  if(u.startsWith("#/")||(CLEAN&&/^\/(?!\/)/.test(u))){e.preventDefault();nav(u.startsWith("#")?u.slice(1):u)}});
addEventListener("scroll",()=>$(".header").classList.toggle("sc",scrollY>8),{passive:true});
router();
</script>
