/* ---------- Estimation (fictive pour l'instant) ----------
   Appelle l'Edge Function « estimate-vehicle » (API Claude) si elle est déployée, sinon utilise la formule de démonstration.
   Ne jamais mettre de clé API dans ce fichier. Garder la même signature et le même retour {low,high}. */
async function estimate(d,kind){
  if(sb){try{
    const {data,error}=await sb.functions.invoke("estimate-vehicle",{body:{brand:d.brand,model:d.model,year:+d.vehicle_year,mileage:+d.mileage,fuel:d.fuel,gearbox:d.gearbox,condition:d.condition,service_history:!!d.service_history,no_accident:!!d.no_accident}});
    if(!error&&data&&data.low>0&&data.high>=data.low)return{low:Math.round(data.low/100)*100,high:Math.round(data.high/100)*100,comment:data.comment||"",source:"ai"};
  }catch(e){console.warn("Estimation IA indisponible",e)}}
  return estimateDemo(d,kind);
}
async function estimateDemo(d,kind){
  await new Promise(r=>setTimeout(r,1100));
  const tier={BMW:1.25,Mercedes:1.25,Audi:1.2,Volkswagen:1,Peugeot:.9,Renault:.85,"Citroën":.85,Tesla:1.4,"Mercedes-Benz":1.25,Porsche:1.9,"Land Rover":1.3,Volvo:1.1,Lexus:1.2,Mini:1.05,Toyota:1,Dacia:.7,Fiat:.8,Opel:.85}[(d.brand||"").trim()]||1;
  const age=Math.max(0,new Date().getFullYear()-(+d.vehicle_year||new Date().getFullYear()));
  let val=30000*tier*Math.pow(.86,age);
  val*=Math.min(1.15,Math.max(.6,1-.02*((+d.mileage||0)-15000*age)/10000));
  val*={"Très bon":1.03,"Bon":1,"Correct":.93,"À prévoir":.84}[d.condition]||1;
  if(d.service_history)val*=1.02;if(d.no_accident)val*=1.02;
  
  const r=n=>Math.max(500,Math.round(n/100)*100);
  return{low:r(val*.95),high:r(val*1.05),source:"demo"};
}

    res.innerHTML=`<p class="rl">${"Prix de vente estimé"}</p><p class="rp">${money(est.low)} <span>à</span> ${money(est.high)}</p>
<p>${esc(d.brand)} ${esc(d.model)} · ${esc(d.vehicle_year)} · ${km(+d.mileage)} · état ${esc(String(d.condition||"").toLowerCase())}</p>
${est.comment?`<p>${esc(est.comment)}</p>`:""}<p class="monthly">${est.source==="ai"?"":"Montant de démonstration. "}Estimation indicative, confirmée après examen du véhicule.</p>

async function sendLead(form){
  const st=$(".status",form),btn=$("button[type=submit]",form),d=Object.fromEntries(new FormData(form));
  const say=(m,ok)=>{st.textContent=m;st.className="status full "+(ok?"ok":"ko")};
  if(d.website){say("Votre demande a bien été envoyée.",true);return}
  delete d.website;delete d.consent;
  for(const k of Object.keys(d)){if(typeof d[k]==="string")d[k]=d[k].trim();if(d[k]==="")delete d[k]}
  const COLS=["first_name","last_name","phone","email","subject","message","registration","brand","model","vehicle_year","mileage","fuel","gearbox","condition"],extra={};for(const k of Object.keys(d))if(!COLS.includes(k)){extra[k]=d[k];delete d[k]}
  ["vehicle_year","mileage"].forEach(k=>{if(k in d){const n=parseInt(d[k],10);Number.isFinite(n)?d[k]=n:delete d[k]}});
  Object.assign(d,{type:form.dataset.lead,metadata:{...extra,consent:true,consent_at:new Date().toISOString(),source:form.dataset.source,page:location.href}});
  if(form.dataset.vehicle)d.vehicle_id=form.dataset.vehicle;
  if(!sb){say("Mode démonstration : cette demande n'a pas été enregistrée.",false);return}
  btn.disabled=true;
  const {error}=await sb.from("leads").insert(d);
  btn.disabled=false;
  if(error){console.error(error);say(`Votre demande n'a pas pu être envoyée. Réessayez ou appelez-nous au ${SITE.phone}.`,false)}
  else{say("Merci, votre demande a bien été envoyée. Nous revenons vers vous rapidement.",true);form.reset()}
}
